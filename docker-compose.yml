name: comics

services:
  # 1. PostgreSQL 16 - Main Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: comics_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: comics_password_2026
      POSTGRES_DB: comics_db
    ports:
      - "5432:5432"
    volumes:
      - comics_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres -c max_connections=200
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comics_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 - Cache & View Counter
  redis:
    image: redis:7-alpine
    container_name: comics_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - comics_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Adminer - Database Management Web GUI
  adminer:
    image: adminer:latest
    container_name: comics_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  comics_postgres_data:
    name: comics_postgres_data
  comics_redis_data:
    name: comics_redis_data
